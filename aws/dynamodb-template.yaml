AWSTemplateFormatVersion: '2010-09-09'
Description: 'ReLoop Circular Resource Intelligence - Amazon DynamoDB Storage & Least-Privilege IAM Policy'

Parameters:
  TableName:
    Type: String
    Default: 'reloop-records'
    Description: 'Name of the DynamoDB table for ReLoop resource recovery records'

Resources:
  ReloopDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: ReLoop
        - Key: Team
          Value: GreenStack
        - Key: Hackathon
          Value: EnvironmentalHacks

  ReloopAppIAMPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ReloopApplicationDynamoDBAccess
      Description: 'Least privilege policy allowing ReLoop Next.js server handlers to access the DynamoDB table'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Scan
              - dynamodb:Query
              - dynamodb:DescribeTable
            Resource:
              - !GetAtt ReloopDynamoDBTable.Arn
              - !Sub '${ReloopDynamoDBTable.Arn}/index/*'

Outputs:
  DynamoDBTableName:
    Description: 'Name of the created DynamoDB Table'
    Value: !Ref ReloopDynamoDBTable
  DynamoDBTableArn:
    Description: 'ARN of the DynamoDB Table'
    Value: !GetAtt ReloopDynamoDBTable.Arn
